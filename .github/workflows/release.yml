name: Release

# Biggest structural change in this migration (ci-target-schema.md section 10 step 9):
# Rezepte previously released via `pull_request_target: closed` (reacting to the promotion
# PR being merged). That is replaced here by `push` on main + `tags: v*.*.*`, matching the
# asset-repair-capable design in section 4.10: a branch push to main is classified as an
# automatic release (version via semantic-release --dry-run), a pushed vX.Y.Z tag is a manual
# release (version taken directly from the tag). See scripts/resolve-release-version.mjs.

"on":
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

# Prevents parallel release runs (e.g. a fast merge to main followed shortly after by a
# manually pushed tag): resolve-release-version.mjs decides on a single target tag/version by
# querying the GitHub API and existing tags - without serialization, two concurrent runs could
# race for the same version or fail to create the release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        # Generalized asset-repair mechanism (ci-target-schema.md section 4.10): classifies
        # this run as automatic (branch push to main, version via semantic-release --dry-run)
        # or manual (a pushed vX.Y.Z tag), then checks whether a GitHub release for the
        # resolved tag already exists and whether it already has all expected assets. Missing
        # assets are repaired in place instead of duplicating the release. See
        # scripts/resolve-release-version.mjs.
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-release-version.mjs

      - name: Check out release tag for asset repair
        # Only relevant for the repair path: a previous run created the tag/release but was
        # interrupted before all assets were uploaded. This checks out the exact tagged
        # commit so the rebuilt assets match the already-published release, instead of
        # rebuilding from whatever commit triggered this run.
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'upload-existing'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git checkout --detach "$RELEASE_TAG"

          expected_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$expected_commit" ]; then
            echo "Release tag checkout did not resolve to the tagged commit." >&2
            exit 1
          fi

      - name: Resolve release commit
        # The commit this release's assets should be built from: the triggering commit for a
        # "create" run, or the checked-out release tag's commit for an "upload-existing" repair
        # run (see the step above). Used for the contract export's SourceCommit below, so a
        # repaired release's contract metadata still points at the tagged commit rather than
        # whatever commit happened to trigger the repair run.
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        run: dotnet restore Rezepte.sln

      - name: Build application and plugins
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        run: dotnet build Rezepte.Web/Rezepte.Web.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Build tests
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        run: dotnet build Rezepte.Tests/Rezepte.Tests.csproj --configuration Release --no-restore

      - name: Build browser tests
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        run: dotnet build Rezepte.Tests.Browser/Rezepte.Tests.Browser.csproj --configuration Release --no-restore

      - name: Install Playwright browsers
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        run: |
          PLAYWRIGHT_SCRIPT=$(find Rezepte.Tests.Browser/bin/Release -name "playwright.ps1" | head -n 1)
          if [ -z "$PLAYWRIGHT_SCRIPT" ]; then
            echo "playwright.ps1 not found under Rezepte.Tests.Browser/bin/Release - did the browser test build succeed?" >&2
            exit 1
          fi
          pwsh "$PLAYWRIGHT_SCRIPT" install --with-deps chromium

      - name: Publish application for browser tests
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        run: dotnet publish Rezepte.Web/Rezepte.Web.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Release gate - tests
        # Safety net now that PRs against main can only come from staging, which was already
        # fully validated by pr-staging-ci.yml/staging-ci.yml (ci-target-schema.md section 11,
        # item 2 - no separate PR-gate workflow against main). Runs for both automatic and
        # manual-tag releases, but not for the asset-repair path, which only needs to rebuild
        # an already-validated release.
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        run: |
          dotnet test Rezepte.Tests/Rezepte.Tests.csproj --configuration Release --no-build
          dotnet test Rezepte.Tests.Browser/Rezepte.Tests.Browser.csproj --configuration Release --no-build

      - name: Build and package
        if: steps.version.outputs.released == 'true'
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ steps.version.outputs.version }}
          release-tag: ${{ steps.version.outputs.tag }}

      - name: Export import plugin contract
        # Rezepte-specific ApiCompat contract export (ci-target-schema.md section 7) - not
        # part of the shared cross-project schema, kept as-is. Unlike staging-ci.yml's
        # pre-release runs, real releases attach this export as a release asset (see the
        # publish steps below).
        if: steps.version.outputs.released == 'true'
        id: contract
        shell: pwsh
        run: |
          $exportArgs = @{
            OutputDirectory = "artifacts/contract-export"
            SourceCommit = "${{ steps.commit.outputs.sha }}"
          }

          $baselineDirectory = "contract-baselines/import-contract"
          if (Test-Path -LiteralPath $baselineDirectory -PathType Container) {
            dotnet tool install Microsoft.DotNet.ApiCompat.Tool --tool-path ./.tools
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Microsoft.DotNet.ApiCompat.Tool."
            }

            $apiCompatTool = if ($IsWindows) { ".\\.tools\\apicompat.exe" } else { "./.tools/apicompat" }
            $exportArgs["ApiCompatBaselineDirectory"] = $baselineDirectory
            $exportArgs["ApiCompatToolPath"] = $apiCompatTool
          }
          else {
            Write-Host "No stored ApiCompat baselines found; contract export will skip historical API comparison."
          }

          ./scripts/Export-ImportContract.ps1 @exportArgs

          $contractZip = Get-ChildItem -LiteralPath "artifacts/contract-export" -Filter "rezepte-import-contract-*.zip" |
            Sort-Object Name | Select-Object -First 1
          if (-not $contractZip) {
            throw "No rezepte-import-contract-*.zip was produced under artifacts/contract-export."
          }

          $metadataPath = "artifacts/contract-export/contract-export.metadata.json"
          $tag = "${{ steps.version.outputs.tag }}"
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$($contractZip.Name)"
          $metadata = Get-Content -Raw -LiteralPath $metadataPath | ConvertFrom-Json
          $metadata | Add-Member -NotePropertyName "artifactUrl" -NotePropertyValue $assetUrl -Force
          $metadata | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $metadataPath -Encoding UTF8

          "zip_path=$($contractZip.FullName)" | Add-Content -Path $env:GITHUB_OUTPUT
          "metadata_path=$((Resolve-Path $metadataPath).Path)" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Create automatic GitHub release
        # Goes through semantic-release's own publish pipeline (release.config.js:
        # commit-analyzer, release-notes-generator, then @semantic-release/github, which
        # creates the tag, the GitHub release and uploads the assets listed via
        # RELEASE_ASSET_PATHS/RELEASE_MANIFEST_PATH below). Manual-tag and asset-repair
        # releases intentionally stay on gh CLI / softprops below, matching
        # Softwareschmiede's reference release.yml: semantic-release only knows about
        # conventional-commit-driven releases on configured branches, not about a tag someone
        # pushed manually or a one-off missing-asset repair.
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create' && steps.version.outputs.release_kind == 'automatic'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ASSET_PATHS: |
            artifacts/release-linux-x64.zip
            artifacts/release-win-x64.zip
            ${{ steps.contract.outputs.zip_path }}
            ${{ steps.contract.outputs.metadata_path }}
          RELEASE_MANIFEST_PATH: artifacts/update.json
        run: npm run release

      - name: Create manual-tag GitHub release
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create' && steps.version.outputs.release_kind == 'manual'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/release-linux-x64.zip
            artifacts/release-win-x64.zip
            artifacts/update.json
            ${{ steps.contract.outputs.zip_path }}
            ${{ steps.contract.outputs.metadata_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload missing assets to existing release
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'upload-existing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release upload "$tag" \
            artifacts/release-linux-x64.zip \
            artifacts/release-win-x64.zip \
            artifacts/update.json \
            "${{ steps.contract.outputs.zip_path }}" \
            "${{ steps.contract.outputs.metadata_path }}" \
            --clobber
