name: Release

"on":
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          last_tag="$(
            git tag --list 'v*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )"

          if [[ -z "$last_tag" ]]; then
            version="1.0.0"
            create_tag="true"
            range="HEAD"
          else
            base_version="${last_tag#v}"
            range="${last_tag}..HEAD"
            messages="$(git log --format=%B "$range")"

            if [[ -z "$(git rev-list --max-count=1 "$range")" ]]; then
              bump="none"
            elif printf '%s\n' "$messages" | grep -Eq '(^[A-Za-z]+(\([^)]+\))?!:|^BREAKING CHANGE:)'; then
              bump="major"
            elif printf '%s\n' "$messages" | grep -Eq '^feat(\([^)]+\))?:'; then
              bump="minor"
            elif printf '%s\n' "$messages" | grep -Eq '^fix(\([^)]+\))?:'; then
              bump="patch"
            else
              bump="none"
            fi

            IFS='.' read -r major minor patch <<< "$base_version"

            case "$bump" in
              major)
                version="$((major + 1)).0.0"
                create_tag="true"
                ;;
              minor)
                version="${major}.$((minor + 1)).0"
                create_tag="true"
                ;;
              patch)
                version="${major}.${minor}.$((patch + 1))"
                create_tag="true"
                ;;
              none)
                version="$base_version"
                create_tag="false"
                ;;
            esac
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Rezepte.sln

      - name: Restore publish runtime
        run: dotnet restore Rezepte.Web/Rezepte.Web.csproj --runtime linux-x64

      - name: Build application and plugins
        run: dotnet build Rezepte.Web/Rezepte.Web.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build Rezepte.Tests/Rezepte.Tests.csproj --configuration Release --no-restore

      - name: Build browser tests
        run: dotnet build Rezepte.Tests.Browser/Rezepte.Tests.Browser.csproj --configuration Release --no-restore

      - name: Install Playwright browsers
        run: |
          PLAYWRIGHT_SCRIPT=$(find Rezepte.Tests.Browser/bin/Release -name "playwright.ps1" | head -n 1)
          if [ -z "$PLAYWRIGHT_SCRIPT" ]; then
            echo "playwright.ps1 not found under Rezepte.Tests.Browser/bin/Release - did the browser test build succeed?" >&2
            exit 1
          fi
          pwsh "$PLAYWRIGHT_SCRIPT" install --with-deps chromium

      - name: Publish application for browser tests
        run: dotnet publish Rezepte.Web/Rezepte.Web.csproj --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test Rezepte.Tests/Rezepte.Tests.csproj --configuration Release --no-build
          dotnet test Rezepte.Tests.Browser/Rezepte.Tests.Browser.csproj --configuration Release --no-build

      - name: Publish
        run: >
          dotnet publish Rezepte.Web/Rezepte.Web.csproj
          --configuration Release
          --framework net10.0
          --runtime linux-x64
          --self-contained false
          --no-restore
          --output artifacts/publish

      - name: Write release metadata
        shell: bash
        run: |
          cat > artifacts/publish/release-metadata.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "commit": "${{ github.event.pull_request.merge_commit_sha }}",
            "runId": "${{ github.run_id }}",
            "createdAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Export import plugin contract
        shell: pwsh
        run: |
          $exportArgs = @{
            OutputDirectory = "artifacts/contract-export"
            SourceCommit = "${{ github.event.pull_request.merge_commit_sha }}"
          }

          $baselineDirectory = "contract-baselines/import-contract"
          if (Test-Path -LiteralPath $baselineDirectory -PathType Container) {
            dotnet tool install Microsoft.DotNet.ApiCompat.Tool --tool-path ./.tools
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Microsoft.DotNet.ApiCompat.Tool."
            }

            $apiCompatTool = if ($IsWindows) { ".\\.tools\\apicompat.exe" } else { "./.tools/apicompat" }
            $exportArgs["ApiCompatBaselineDirectory"] = $baselineDirectory
            $exportArgs["ApiCompatToolPath"] = $apiCompatTool
          }
          else {
            Write-Host "No stored ApiCompat baselines found; contract export will skip historical API comparison."
          }

          ./scripts/Export-ImportContract.ps1 @exportArgs

      - name: Create release.zip
        shell: bash
        run: |
          cd artifacts/publish
          zip -r ../release.zip .

      - name: Create update manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          release_sha="$(sha256sum artifacts/release.zip | awk '{print $1}')"
          release_size="$(stat -c%s artifacts/release.zip)"
          release_asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/release.zip"

          jq -n \
            --arg version "$VERSION" \
            --arg releaseNotes "Automated release for ${MERGE_SHA}" \
            --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg assetUrl "$release_asset_url" \
            --arg sha256 "$release_sha" \
            --argjson sizeBytes "$release_size" \
            '{
              version: $version,
              releaseNotes: $releaseNotes,
              publishedAt: $publishedAt,
              assets: [
                {
                  platform: "linux",
                  runtimeIdentifier: "linux-x64",
                  assetName: "release.zip",
                  assetUrl: $assetUrl,
                  sha256: $sha256,
                  sizeBytes: $sizeBytes
                }
              ]
            }' > artifacts/update.json

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}-${{ github.event.pull_request.merge_commit_sha }}
          path: |
            artifacts/release.zip
            artifacts/update.json
          if-no-files-found: error

      - name: Upload import contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: import-contract-${{ github.event.pull_request.merge_commit_sha }}
          path: |
            artifacts/contract-export/rezepte-import-contract-*.zip
            artifacts/contract-export/contract-export.metadata.json
          if-no-files-found: error

      - name: Create Git tag and GitHub Release
        if: steps.version.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          contract_zip="$(find artifacts/contract-export -maxdepth 1 -name 'rezepte-import-contract-*.zip' | sort | head -n 1)"
          contract_sha="$(jq -r '.artifactSha256' artifacts/contract-export/contract-export.metadata.json)"
          contract_version="$(jq -r '.contractVersion' artifacts/contract-export/contract-export.metadata.json)"
          contract_asset="$(basename "$contract_zip")"
          contract_asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${contract_asset}"
          metadata_tmp="$(mktemp)"
          jq --arg artifactUrl "$contract_asset_url" '. + { artifactUrl: $artifactUrl }' \
            artifacts/contract-export/contract-export.metadata.json > "$metadata_tmp"
          mv "$metadata_tmp" artifacts/contract-export/contract-export.metadata.json

          notes="$(printf 'Automated release for %s\n\nImport contract:\n- contractVersion: %s\n- sourceCommit: %s\n- zipSha256: %s\n- asset: %s\n- assetUrl: %s' \
            "$MERGE_SHA" "$contract_version" "$MERGE_SHA" "$contract_sha" "$contract_asset" "$contract_asset_url")"

          gh release create "$TAG" artifacts/release.zip artifacts/update.json "$contract_zip" artifacts/contract-export/contract-export.metadata.json \
            --title "$TAG" \
            --target "$MERGE_SHA" \
            --notes "$notes"
