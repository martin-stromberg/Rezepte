name: Staging Branch CI

"on":
  push:
    branches: [staging]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: staging-ci
  cancel-in-progress: true

jobs:
  detect-backmerge:
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether push is a pure back-merge from main
        id: check
        run: |
          git fetch origin main --no-tags
          if git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pure back-merge from main detected (tree identical) - CI checks will be skipped."
          else
            echo "is_backmerge=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    runs-on: ubuntu-latest
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    outputs:
      next_version: ${{ steps.semver.outputs.next_version }}
      rc_version: ${{ steps.semver.outputs.rc_version }}
      bump: ${{ steps.semver.outputs.bump }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semantic version and release candidate
        id: semver
        shell: bash
        run: |
          set -euo pipefail

          last_tag="$(
            git tag --list 'v*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )"

          if [[ -z "$last_tag" ]]; then
            base_version="0.0.0"
            bump="minor"
            next_version="1.0.0"
          else
            base_version="${last_tag#v}"
            range="${last_tag}..HEAD"
            messages="$(git log --format=%B "$range")"

            if [[ -z "$(git rev-list --max-count=1 "$range")" ]]; then
              bump="none"
            elif printf '%s\n' "$messages" | grep -Eq '(^[A-Za-z]+(\([^)]+\))?!:|^BREAKING CHANGE:)'; then
              bump="major"
            elif printf '%s\n' "$messages" | grep -Eq '^feat(\([^)]+\))?:'; then
              bump="minor"
            elif printf '%s\n' "$messages" | grep -Eq '^fix(\([^)]+\))?:'; then
              bump="patch"
            else
              bump="none"
            fi

            IFS='.' read -r major minor patch <<< "$base_version"

            case "$bump" in
              major)
                next_version="$((major + 1)).0.0"
                ;;
              minor)
                next_version="${major}.$((minor + 1)).0"
                ;;
              patch)
                next_version="${major}.${minor}.$((patch + 1))"
                ;;
              none)
                next_version="$base_version"
                ;;
            esac
          fi

          rc_version="${next_version}-rc.${GITHUB_RUN_NUMBER}"

          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          echo "rc_version=$rc_version" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

  verify:
    name: Restore, build, test, and format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MSTOOLS_UPDATER_READ_TOKEN || github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Rezepte.sln

      - name: Build application and plugins
        run: dotnet build Rezepte.Web/Rezepte.Web.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build Rezepte.Tests/Rezepte.Tests.csproj --configuration Release --no-restore

      - name: Build browser tests
        run: dotnet build Rezepte.Tests.Browser/Rezepte.Tests.Browser.csproj --configuration Release --no-restore

      - name: Install Playwright browsers
        run: |
          PLAYWRIGHT_SCRIPT=$(find Rezepte.Tests.Browser/bin/Release -name "playwright.ps1" | head -n 1)
          if [ -z "$PLAYWRIGHT_SCRIPT" ]; then
            echo "playwright.ps1 not found under Rezepte.Tests.Browser/bin/Release - did the browser test build succeed?" >&2
            exit 1
          fi
          pwsh "$PLAYWRIGHT_SCRIPT" install --with-deps chromium

      - name: Publish application for browser tests
        run: dotnet publish Rezepte.Web/Rezepte.Web.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Rezepte.sln --configuration Release --no-build

      - name: Export import plugin contract
        shell: pwsh
        run: |
          $exportArgs = @{
            OutputDirectory = "artifacts/contract-export"
            SourceCommit = "${{ github.sha }}"
          }

          $baselineDirectory = "contract-baselines/import-contract"
          if (Test-Path -LiteralPath $baselineDirectory -PathType Container) {
            dotnet tool install Microsoft.DotNet.ApiCompat.Tool --tool-path ./.tools
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Microsoft.DotNet.ApiCompat.Tool."
            }

            $apiCompatTool = if ($IsWindows) { ".\\.tools\\apicompat.exe" } else { "./.tools/apicompat" }
            $exportArgs["ApiCompatBaselineDirectory"] = $baselineDirectory
            $exportArgs["ApiCompatToolPath"] = $apiCompatTool
          }
          else {
            Write-Host "No stored ApiCompat baselines found; contract export will skip historical API comparison."
          }

          ./scripts/Export-ImportContract.ps1 @exportArgs

      - name: Check formatting
        run: dotnet format Rezepte.sln --verify-no-changes --no-restore

  prerelease:
    name: Create release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-backmerge, version, verify]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MSTOOLS_UPDATER_READ_TOKEN || github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Rezepte.sln

      - name: Build application and plugins
        run: dotnet build Rezepte.Web/Rezepte.Web.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build Rezepte.Tests/Rezepte.Tests.csproj --configuration Release --no-restore

      - name: Build browser tests
        run: dotnet build Rezepte.Tests.Browser/Rezepte.Tests.Browser.csproj --configuration Release --no-restore

      - name: Restore publish runtime
        run: dotnet restore Rezepte.Web/Rezepte.Web.csproj --runtime linux-x64

      - name: Publish application
        run: >
          dotnet publish Rezepte.Web/Rezepte.Web.csproj
          --configuration Release
          --framework net10.0
          --runtime linux-x64
          --self-contained false
          --no-restore
          --output artifacts/publish

      - name: Write release metadata
        shell: bash
        run: |
          cat > artifacts/publish/release-metadata.json <<EOF
          {
            "version": "${{ needs.version.outputs.rc_version }}",
            "commit": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
            "createdAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Export import plugin contract
        shell: pwsh
        run: |
          $exportArgs = @{
            OutputDirectory = "artifacts/contract-export"
            SourceCommit = "${{ github.sha }}"
          }

          $baselineDirectory = "contract-baselines/import-contract"
          if (Test-Path -LiteralPath $baselineDirectory -PathType Container) {
            dotnet tool install Microsoft.DotNet.ApiCompat.Tool --tool-path ./.tools
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Microsoft.DotNet.ApiCompat.Tool."
            }

            $apiCompatTool = if ($IsWindows) { ".\\.tools\\apicompat.exe" } else { "./.tools/apicompat" }
            $exportArgs["ApiCompatBaselineDirectory"] = $baselineDirectory
            $exportArgs["ApiCompatToolPath"] = $apiCompatTool
          }
          else {
            Write-Host "No stored ApiCompat baselines found; contract export will skip historical API comparison."
          }

          ./scripts/Export-ImportContract.ps1 @exportArgs

      - name: Create release.zip
        shell: bash
        run: |
          cd artifacts/publish
          zip -r ../release.zip .

      - name: Create update manifest
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.rc_version }}
          TAG: v${{ needs.version.outputs.rc_version }}
        run: |
          set -euo pipefail

          release_sha="$(sha256sum artifacts/release.zip | awk '{print $1}')"
          release_size="$(stat -c%s artifacts/release.zip)"
          release_asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/release.zip"

          jq -n \
            --arg version "$VERSION" \
            --arg releaseNotes "Release candidate for ${GITHUB_SHA}" \
            --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg assetUrl "$release_asset_url" \
            --arg sha256 "$release_sha" \
            --argjson sizeBytes "$release_size" \
            '{
              version: $version,
              releaseNotes: $releaseNotes,
              publishedAt: $publishedAt,
              assets: [
                {
                  platform: "linux",
                  runtimeIdentifier: "linux-x64",
                  assetName: "release.zip",
                  assetUrl: $assetUrl,
                  sha256: $sha256,
                  sizeBytes: $sizeBytes
                }
              ]
            }' > artifacts/update.json

      - name: Create release candidate
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.rc_version }}
          name: Pre-release v${{ needs.version.outputs.rc_version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: true
          files: |
            artifacts/release.zip
            artifacts/update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
