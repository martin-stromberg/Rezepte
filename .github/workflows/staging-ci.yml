name: Pre-Release

# Filename stays staging-ci.yml (only the display name changes to "Pre-Release") - see
# ci-target-schema.md section 3. staging-to-main-promotion.yml's workflow_run trigger
# references this display name, not the filename; both were updated together in the same
# commit so the promotion chain never briefly points at a name that no longer exists.
#
# Job structure changed to the cross-project hybrid model (section 4.2/4.3): static-checks
# and build-and-test now run in parallel (no needs: between them), followed by version and
# prerelease. detect-backmerge below is unchanged from before this migration - it is already
# the most thorough backmerge check across all projects (merge-parent + tree-diff) and is the
# template the other projects are copying (section 10 step 9), not something to touch here.
# Versioning changed from the previous custom Bash conventional-commit parser to
# semantic-release (section 4.8).

on:
  push:
    branches:
      - staging

concurrency:
  group: staging-ci
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-backmerge:
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether push is a pure back-merge from main
        id: check
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          main_sha="$(git rev-parse origin/main)"
          is_main_merge_parent=false
          for parent in $(git show -s --format=%P HEAD); do
            if [[ "$parent" == "$main_sha" ]]; then
              is_main_merge_parent=true
              break
            fi
          done

          if [[ "$is_main_merge_parent" == "true" ]]; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Back-merge from main detected - CI checks will be skipped."
          elif git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pure back-merge from main detected (tree identical) - CI checks will be skipped."
          else
            echo "is_backmerge=false" >> "$GITHUB_OUTPUT"
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Rezepte.sln

      - name: Format check
        run: dotnet format Rezepte.sln --verify-no-changes --no-restore --severity error

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          solution-path: Rezepte.sln
          artifact-name: vulnerable-packages-staging

      - name: Static analysis
        run: dotnet build Rezepte.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Rezepte.sln

      - name: Build application and plugins
        run: dotnet build Rezepte.Web/Rezepte.Web.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build Rezepte.Tests/Rezepte.Tests.csproj --configuration Release --no-restore

      - name: Build browser tests
        run: dotnet build Rezepte.Tests.Browser/Rezepte.Tests.Browser.csproj --configuration Release --no-restore

      - name: Install Playwright browsers
        run: |
          PLAYWRIGHT_SCRIPT=$(find Rezepte.Tests.Browser/bin/Release -name "playwright.ps1" | head -n 1)
          if [ -z "$PLAYWRIGHT_SCRIPT" ]; then
            echo "playwright.ps1 not found under Rezepte.Tests.Browser/bin/Release - did the browser test build succeed?" >&2
            exit 1
          fi
          pwsh "$PLAYWRIGHT_SCRIPT" install --with-deps chromium

      - name: Publish application for browser tests
        run: dotnet publish Rezepte.Web/Rezepte.Web.csproj --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Rezepte.sln --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report
        run: reportgenerator "-reports:**/TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"

      - name: Enforce coverage threshold
        env:
          COVERAGE_THRESHOLD: '70'
        run: |
          set -euo pipefail
          summary="coverage-report/Summary.txt"
          if ! grep -q "Line coverage:" "$summary"; then
            echo "Could not determine line coverage from the generated report." >&2
            exit 1
          fi
          coverage="$(grep -m1 "Line coverage:" "$summary" | grep -oE '[0-9]+([.,][0-9]+)?' | head -n1 | tr ',' '.')"
          threshold="$COVERAGE_THRESHOLD"
          echo "Line coverage: ${coverage}% (threshold: ${threshold}%)"
          awk -v cov="$coverage" -v thr="$threshold" 'BEGIN { exit !(cov >= thr) }'

      - name: Export import plugin contract
        shell: pwsh
        run: |
          $exportArgs = @{
            OutputDirectory = "artifacts/contract-export"
            SourceCommit = "${{ github.sha }}"
          }

          $baselineDirectory = "contract-baselines/import-contract"
          if (Test-Path -LiteralPath $baselineDirectory -PathType Container) {
            dotnet tool install Microsoft.DotNet.ApiCompat.Tool --tool-path ./.tools
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Microsoft.DotNet.ApiCompat.Tool."
            }

            $apiCompatTool = if ($IsWindows) { ".\\.tools\\apicompat.exe" } else { "./.tools/apicompat" }
            $exportArgs["ApiCompatBaselineDirectory"] = $baselineDirectory
            $exportArgs["ApiCompatToolPath"] = $apiCompatTool
          }
          else {
            Write-Host "No stored ApiCompat baselines found; contract export will skip historical API comparison."
          }

          ./scripts/Export-ImportContract.ps1 @exportArgs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-staging
          path: coverage-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-staging
          path: |
            Rezepte.Tests/TestResults/*.trx
            Rezepte.Tests.Browser/TestResults/*.trx
          retention-days: 14

  version:
    name: version
    needs: [detect-backmerge, static-checks, build-and-test]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.semver.outputs.changed }}
      version: ${{ steps.semver.outputs.version }}
      rc_tag: ${{ steps.rc.outputs.rc_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Determine next version
        # release.config.js only lists "main" as a release branch; staging is deliberately not
        # a configured prerelease branch there (ci-target-schema.md section 4.8). The
        # --branches override below treats "staging" as a plain release branch for this
        # dry-run only, so the resulting X.Y.Z carries no prerelease identifier - the RC suffix
        # (lowercase, section 4.6) is appended manually in the next step instead.
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          output="$(npx semantic-release --dry-run --no-ci --branches staging 2>&1 | tee /dev/stderr)"

          version=""
          changed="false"
          if [[ "$output" =~ The\ next\ release\ version\ is\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.+-]+)?) ]]; then
            version="${BASH_REMATCH[1]}"
            changed="true"
            echo "Next release version: $version"
          else
            echo "No new release version determined."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Determine RC number
        if: steps.semver.outputs.changed == 'true'
        id: rc
        run: |
          version="${{ steps.semver.outputs.version }}"
          existing_count="$(git tag --list "v${version}-rc.*" | wc -l | tr -d ' ')"
          rc_number=$((existing_count + 1))
          echo "rc_number=$rc_number" >> "$GITHUB_OUTPUT"
          echo "rc_tag=v${version}-rc.${rc_number}" >> "$GITHUB_OUTPUT"

  prerelease:
    name: prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and package release candidate
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ needs.version.outputs.version }}
          release-tag: ${{ needs.version.outputs.rc_tag }}

      - name: Export import plugin contract
        # Validation only for release candidates (not attached as a release asset) - matches
        # Rezepte's pre-existing behavior; only real releases (release.yml) publish the
        # contract export artifact.
        shell: pwsh
        run: |
          $exportArgs = @{
            OutputDirectory = "artifacts/contract-export"
            SourceCommit = "${{ github.sha }}"
          }

          $baselineDirectory = "contract-baselines/import-contract"
          if (Test-Path -LiteralPath $baselineDirectory -PathType Container) {
            dotnet tool install Microsoft.DotNet.ApiCompat.Tool --tool-path ./.tools
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Microsoft.DotNet.ApiCompat.Tool."
            }

            $apiCompatTool = if ($IsWindows) { ".\\.tools\\apicompat.exe" } else { "./.tools/apicompat" }
            $exportArgs["ApiCompatBaselineDirectory"] = $baselineDirectory
            $exportArgs["ApiCompatToolPath"] = $apiCompatTool
          }
          else {
            Write-Host "No stored ApiCompat baselines found; contract export will skip historical API comparison."
          }

          ./scripts/Export-ImportContract.ps1 @exportArgs

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.version.outputs.rc_tag }}"
          gh release create "$tag" artifacts/release-linux-x64.zip artifacts/release-win-x64.zip artifacts/update.json \
            --target "$GITHUB_SHA" \
            --title "Pre-release $tag" \
            --prerelease \
            --generate-notes
