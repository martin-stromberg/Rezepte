name: Build and package

description: >
  Provisions the .NET 10 SDK, restores, publishes Rezepte.Web self-contained for both
  linux-x64 and win-x64 (ci-target-schema.md section 6.1 - Rezepte is a cross-platform web
  app, unlike WPF-only Softwareschmiede, so it publishes both runtimes), packages each as a
  ZIP, and generates the update manifest (update.json: SHA-256/size/URL per asset). This is
  Rezepte's own pre-existing manifest format (section 4.7) - it is the target schema other
  projects are migrating to, so it is reused here unchanged. Used by both the "prerelease"
  job in staging-ci.yml ("Pre-Release") and the "release" job in release.yml, so these
  build/publish/zip/manifest steps only exist once instead of being duplicated between them
  (template: Softwareschmiede's ./.github/actions/build-and-package).

inputs:
  release-version:
    description: Version without a leading v, written into update.json and passed as -p:Version.
    required: true
  release-tag:
    description: Release tag (e.g. v1.2.3 or v1.2.3-rc.1), used to build each asset's download URL.
    required: true

runs:
  using: composite
  steps:
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Rezepte.sln
      shell: bash

    - name: Build application and plugins
      run: dotnet build Rezepte.Web/Rezepte.Web.csproj --configuration Release --no-restore -p:Version=${{ inputs.release-version }}
      shell: bash

    - name: Restore publish runtime (linux-x64)
      run: dotnet restore Rezepte.Web/Rezepte.Web.csproj --runtime linux-x64
      shell: bash

    - name: Publish (linux-x64, self-contained)
      # Self-contained per the App-Release schema (ci-target-schema.md section 6.1): Rezepte
      # previously published framework-dependent (--self-contained false), which this corrects.
      run: >
        dotnet publish Rezepte.Web/Rezepte.Web.csproj -p:Version=${{ inputs.release-version }}
        --configuration Release
        --framework net10.0
        --runtime linux-x64
        --self-contained true
        --no-restore
        --output artifacts/publish
      shell: bash

    - name: Restore publish runtime (win-x64)
      run: dotnet restore Rezepte.Web/Rezepte.Web.csproj --runtime win-x64
      shell: bash

    - name: Publish (win-x64, self-contained)
      run: >
        dotnet publish Rezepte.Web/Rezepte.Web.csproj -p:Version=${{ inputs.release-version }}
        --configuration Release
        --framework net10.0
        --runtime win-x64
        --self-contained true
        --no-restore
        --output artifacts/publish-win-x64
      shell: bash

    - name: Create release-linux-x64.zip
      run: |
        cd artifacts/publish
        zip -r ../release-linux-x64.zip .
      shell: bash

    - name: Create release-win-x64.zip
      run: |
        cd artifacts/publish-win-x64
        zip -r ../release-win-x64.zip .
      shell: bash

    - name: Create update manifest
      # Rezepte's own pre-existing schema (ci-target-schema.md section 4.7): version /
      # releaseNotes / publishedAt / assets[] with platform, runtimeIdentifier, assetName,
      # assetUrl, sha256, sizeBytes per asset.
      shell: bash
      env:
        VERSION: ${{ inputs.release-version }}
        TAG: ${{ inputs.release-tag }}
      run: |
        set -euo pipefail

        linux_sha="$(sha256sum artifacts/release-linux-x64.zip | awk '{print $1}')"
        linux_size="$(stat -c%s artifacts/release-linux-x64.zip)"
        linux_asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/release-linux-x64.zip"

        windows_sha="$(sha256sum artifacts/release-win-x64.zip | awk '{print $1}')"
        windows_size="$(stat -c%s artifacts/release-win-x64.zip)"
        windows_asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/release-win-x64.zip"

        jq -n \
          --arg version "$VERSION" \
          --arg releaseNotes "Rezepte release ${TAG}" \
          --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          --arg linuxAssetUrl "$linux_asset_url" \
          --arg linuxSha256 "$linux_sha" \
          --argjson linuxSizeBytes "$linux_size" \
          --arg windowsAssetUrl "$windows_asset_url" \
          --arg windowsSha256 "$windows_sha" \
          --argjson windowsSizeBytes "$windows_size" \
          '{
            version: $version,
            releaseNotes: $releaseNotes,
            publishedAt: $publishedAt,
            assets: [
              {
                platform: "linux",
                runtimeIdentifier: "linux-x64",
                assetName: "release-linux-x64.zip",
                assetUrl: $linuxAssetUrl,
                sha256: $linuxSha256,
                sizeBytes: $linuxSizeBytes
              },
              {
                platform: "windows",
                runtimeIdentifier: "win-x64",
                assetName: "release-win-x64.zip",
                assetUrl: $windowsAssetUrl,
                sha256: $windowsSha256,
                sizeBytes: $windowsSizeBytes
              }
            ]
          }' > artifacts/update.json
